[package]
name = "sensorpanel"
version = "0.1.2"
edition = "2024"
license = "MPL-2.0"
description = "Native, isolated Windows sensor panel"
repository = "https://github.com/todociber/casepanel"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows-numerics = "=0.2.0"
windows = { version = "=0.61.3", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Registry",
  "Win32_System_LibraryLoader", "Win32_System_IO", "Win32_System_Pipes",
  "Win32_System_Memory", "Win32_System_Power", "Win32_System_Com", "Win32_System_JobObjects",
  "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Imaging",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs",
  "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Devices_Display"
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
